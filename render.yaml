services:
  - type: web
    name: nox-ia-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nox-ia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NOXIA_ADMIN_USERNAME
        value: admin
      - key: NOXIA_ADMIN_PASSWORD
        sync: false

databases:
  - name: nox-ia-db
    plan: free
